version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "@typescript/native"
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Held until @lingui/vite-plugin lists 0.3 as a supported peer.
      - dependency-name: "@rolldown/plugin-babel"
        versions: [">=0.3.0"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Moves together with the windows crate; bumped by hand.
      - dependency-name: "windows-core"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
