name: Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            os: macos
            cargo-cache-dir: src-tauri/target
          - platform: windows-2025
            os: windows
            cargo-cache-dir: C:\t

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # FoundationModels / SpeechAnalyzer need the macOS 26 SDK; pick the
      # newest Xcode 26 on the runner instead of pinning a point release.
      - name: select Xcode
        if: matrix.os == 'macos'
        run: |
          DEVELOPER_DIR="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$DEVELOPER_DIR" xcodebuild -version

      - name: install LLVM
        if: matrix.os == 'windows'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2
        with:
          version: "20.1.8"
          directory: ${{ runner.temp }}/llvm

      - name: configure Windows build paths
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $cargoTargetDir = "C:\t"
          $libclangPath = Join-Path $env:RUNNER_TEMP "llvm\bin"
          New-Item -ItemType Directory -Force $cargoTargetDir | Out-Null
          "CARGO_TARGET_DIR=$cargoTargetDir" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$libclangPath" >> $env:GITHUB_ENV

      - name: cache Vulkan SDK installer
        if: matrix.os == 'windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/VulkanSDK-Installer.exe
          key: vulkan-sdk-installer-1.4.357.0

      - name: install Vulkan SDK
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = "1.4.357.0"
          $installer = Join-Path $env:RUNNER_TEMP "VulkanSDK-Installer.exe"
          if (-not (Test-Path $installer)) {
            curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          }
          & $installer --accept-licenses --default-answer --confirm-command install
          "VULKAN_SDK=C:\VulkanSDK\$version" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin" >> $env:GITHUB_PATH

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: platform-${{ matrix.platform }}
          workspaces: src-tauri -> target
          cache-directories: ${{ matrix.cargo-cache-dir }}
          cache-on-failure: true

      - name: check Rust
        env:
          # Disable i8mm matmul intrinsics; they fail to build with the CI Xcode toolchain.
          CFLAGS_aarch64_apple_darwin: "-U__ARM_FEATURE_MATMUL_INT8"
          CXXFLAGS_aarch64_apple_darwin: "-U__ARM_FEATURE_MATMUL_INT8"
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: add native DLLs to PATH
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "$env:CARGO_TARGET_DIR\debug" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$env:VULKAN_SDK\Bin"         | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: test Rust
        env:
          CFLAGS_aarch64_apple_darwin: "-U__ARM_FEATURE_MATMUL_INT8"
          CXXFLAGS_aarch64_apple_darwin: "-U__ARM_FEATURE_MATMUL_INT8"
        run: cargo test --manifest-path src-tauri/Cargo.toml
